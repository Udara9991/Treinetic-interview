spring.data.mongodb.uri=mongodb://localhost:27017/taskmanagerdb

# JWT Configuration
# PLEASE REPLACE WITH A STRONG, RANDOM SECRET KEY (at least 32 bytes for HS256)
# Example: generate one using a password generator or a command like: openssl rand -base64 32
taskmanager.app.jwtSecret=DefaultSecretKeyMustBeChangedAndAtLeast32BytesLongForHS256SecurityOtherwiseAppWillUseADynamicOne!
taskmanager.app.jwtExpirationMs=86400000 # 24 hours in milliseconds
